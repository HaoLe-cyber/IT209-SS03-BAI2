server {
    listen 80;
    server_name _;

    root /var/www/my-web/html;
    index index.html index.htm;

    # Cấu hình trang lỗi 404 tùy chỉnh
    error_page 404 /404.html;

    # Thiết lập chỉ thị internal chặn truy cập trực tiếp URL /404.html từ bên ngoài
    location = /404.html {
        root /var/www/my-web/html;
        internal;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}